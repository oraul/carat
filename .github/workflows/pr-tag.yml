name: pr-tag

# The trigger of open-pr. A push of a tag runs the tagged commit's copy of
# this file, so a branch controls it: it holds no secret, names no
# environment, checks out nothing, and runs no repository code. It only
# refuses a tag name that is not pr/ and a Conventional Branch; open-pr,
# a workflow_run workflow that GitHub runs only from main's copy, reads
# the tag as data and opens the pull request.
on:
  push:
    tags: ['pr/**']

permissions: {}

jobs:
  check:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a tag that names no Conventional Branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$TAG" | grep -q -x -E 'pr/(feature|bugfix|hotfix|release|chore)/[a-z0-9][a-z0-9-]*' ||
            { echo "::error::not a pr/ tag of a Conventional Branch"; exit 1; }
