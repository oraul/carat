name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out carat
        uses: actions/checkout@v4

      - name: Resolve the Spinel commit
        id: spinel
        run: echo "rev=$(make -s spinel-rev)" >> "$GITHUB_OUTPUT"

      - name: Restore the toolchain from cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: tmp/.toolchain
          key: spinel-${{ runner.os }}-${{ steps.spinel.outputs.rev }}

      # The runner image ships Ruby, so a stub that fails when invoked is put
      # first on the PATH of the toolchain step only: a cold build then proves
      # that the toolchain builds with no Ruby interpreter.
      - name: Stub ruby so the toolchain build cannot use it
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/noruby"
          printf '#!/bin/sh\necho "ruby must not be needed to build the toolchain, but was invoked with: $*" >&2\nexit 127\n' > "$RUNNER_TEMP/noruby/ruby"
          chmod +x "$RUNNER_TEMP/noruby/ruby"

      - name: Build and install the toolchain without Ruby
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: PATH="$RUNNER_TEMP/noruby:$PATH" make toolchain

      - name: Doctor
        run: make doctor

      - name: Build
        run: make build

      - name: Generated config is current
        run: |
          make gen-config
          git diff --exit-code -- carat/domain/default_config.rb

      - name: Test
        run: make test

      # One key of the cursor scenario of the benchmark must allocate fewer
      # than ALLOC_BUDGET objects (see the Makefile); one more compile and a
      # few seconds of running.
      - name: Allocation budget
        run: make bench-budget
