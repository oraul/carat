name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request, or a newer merge to main, cancels
# the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The scope step reads the pull request of a push and its check runs.
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  spin:
    runs-on: ubuntu-latest
    # The steps mirror CHECK_STAGES in the Makefile, whose comment records
    # why CI leaves out three of them: the release build on pull requests,
    # diagnose, and the gates. CI adds the comparison with main's
    # measurement, which needs main's run on the same kind of runner.
    env:
      # The optimization level of the development builds (the editor of the
      # smoke test, the test runner, and the benchmark of the allocation
      # budget); the Makefile reads it, and it is part of the compile
      # cache's key.
      TEST_OPT: "0"
    steps:
      - name: Check out carat
        uses: actions/checkout@v4
        with:
          # The first parent too, which the scope step compares with.
          fetch-depth: 2

      # The job always runs and reports, so a required check on it passes;
      # tools/ci_scope.sh says whether the checks below are needed. They are
      # skipped when only documentation no test reads changed, and on a
      # push to main whose tree is the head of a pull request that passed.
      # A push to main still compiles the development builds, which keeps
      # main's compile cache warm, and builds and smoke tests the release
      # binary.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: sh tools/ci_scope.sh

      - name: Resolve the Spinel commit
        id: spinel
        if: steps.scope.outputs.run == 'true' || github.event_name == 'push'
        run: echo "rev=$(make -s spinel-rev)" >> "$GITHUB_OUTPUT"

      - name: Restore the toolchain from cache
        id: toolchain-cache
        if: steps.scope.outputs.run == 'true' || github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: tmp/.toolchain
          key: spinel-${{ runner.os }}-${{ steps.spinel.outputs.rev }}

      # The runner image ships Ruby. The Makefile puts tools/noruby, a ruby
      # that refuses to run, first on the PATH of every target, so a cold
      # toolchain build proves that the toolchain builds with no Ruby
      # interpreter, and no later step can reach the runner's Ruby either.
      - name: Build and install the toolchain without Ruby
        if: (steps.scope.outputs.run == 'true' || github.event_name == 'push') && steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make toolchain

      # The objects of the units of C of the three development builds
      # (spinel --incremental, SPINEL_CACHE_DIR): the editor of the smoke
      # test, the test runner, and the benchmark of the allocation budget.
      # They are keyed by the Spinel commit, the optimization level, and
      # the OS, which all change the objects. The hash of every Ruby source
      # the three builds read ends the key, so every change saves its own
      # entry, and the fallback restores the newest entry of the same
      # compiler and level: a unit whose text did not change is not
      # compiled again. A pull request can restore what its own runs and
      # main's saved; a push to main always compiles the three builds, so
      # main keeps a warm entry for every unit a pull request compiles.
      - name: Restore the compile cache
        if: steps.scope.outputs.run == 'true' || github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: build/spinel-cache
          key: spinel-units-${{ runner.os }}-${{ steps.spinel.outputs.rev }}-O${{ env.TEST_OPT }}-${{ hashFiles('carat.rb', 'carat/**/*.rb', 'bin/**/*.rb', 'test/**/*.rb', 'bench/**/*.rb') }}
          restore-keys: |
            spinel-units-${{ runner.os }}-${{ steps.spinel.outputs.rev }}-O${{ env.TEST_OPT }}-

      # Fails unless the ruby every make target reaches is the stub.
      - name: Doctor
        if: steps.scope.outputs.run == 'true'
        run: make doctor

      # A test program without a snapshot must fail with the stub's refusal
      # instead of being compared against the runner's Ruby.
      - name: No CRuby
        if: steps.scope.outputs.run == 'true'
        run: make no-cruby

      # The documents' byte budgets, forbidden content, hard-wrapped pull
      # request text, and dead paths. A Markdown-only pull request skips
      # the checks (tools/ci_scope.sh), so the checker's run before the
      # push covers those.
      - name: Docs lint
        if: steps.scope.outputs.run == 'true'
        run: make docs-lint

      # The shell tools behind CI and the delivery pipeline, tested in
      # temporary repositories: tools/ci_scope.sh, the run state, the gates.
      - name: Tools
        if: steps.scope.outputs.run == 'true'
        run: make tools-test

      # The editor the smoke test runs, compiled with the development flags
      # (-O 0, --incremental) like the test runner: Spinel documents the
      # same answers at every level, and the C compiles in seconds instead
      # of the release build's 15 to 20. The release build at -O 2 runs on
      # every push to main and by hand, below.
      # Its compile report is checked against the analysis budget, as the
      # test runner's is.
      - name: Build the editor for the smoke test
        if: steps.scope.outputs.run == 'true' || github.event_name == 'push'
        run: make dev-build

      # The config mirror and the plugin registry both match config/.
      - name: Generated config is current
        if: steps.scope.outputs.run == 'true'
        run: make config-current

      # Every test program in one, compiled once; Spinel's analysis of it
      # must take at most ANALYSIS_ROUNDS re-narrowing rounds (see the
      # Makefile), checked from the compile's own report.
      - name: Compile the tests
        if: steps.scope.outputs.run == 'true' || github.event_name == 'push'
        run: make test-build

      - name: Test
        if: steps.scope.outputs.run == 'true'
        run: make test-run CARAT_BIN=build/dev/carat

      # One key of the cursor scenario of the benchmark must allocate fewer
      # than ALLOC_BUDGET objects (see the Makefile). The benchmark is a
      # development build too: every scenario allocates the same objects
      # and bytes per key at -O 0 as at -O 2. A push to main runs it to keep
      # the benchmark's units in the compile cache.
      - name: Allocation budget
        if: steps.scope.outputs.run == 'true' || github.event_name == 'push'
        run: make bench-budget

      # The measurement of tools/metrics.sh from the three development
      # builds above: re-narrowing rounds and analysis milliseconds of both
      # roots, allocations and time per key of eight scenarios. A push to
      # main saves it in the Actions cache; a pull request compares itself
      # with the entry of its base commit, or the newest of main, on the
      # same kind of runner: more allocations or rounds fail, time more
      # than 20 percent slower warns. A pull request cannot write main's
      # cache scope. With no entry the comparison passes with a notice;
      # the delivery workflow still compares with the last history row,
      # and with main when they differ, before the push.
      - name: Measure
        if: steps.scope.outputs.run == 'true' || github.event_name == 'push'
        run: make metrics

      - name: Restore the measurement of main
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: build/metrics/main
          key: carat-metrics-main-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            carat-metrics-main-

      - name: Compare with main
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        run: make metrics-compare BASE_METRICS=build/metrics/main/current.tsv

      - name: Keep the measurement of main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdir -p build/metrics/main && cp build/metrics/current.tsv build/metrics/main/current.tsv

      - name: Save the measurement of main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: build/metrics/main
          key: carat-metrics-main-${{ github.sha }}

      # The release binary, spin build at -O 2, and the smoke test against
      # it, on every push to main and on a run by hand, so the binary make
      # build and make install produce is built and run on every commit of
      # main. Pull requests run the smoke test on the development build.
      - name: Release build
        if: github.event_name != 'pull_request'
        run: make build

      - name: Smoke test the release build
        if: github.event_name != 'pull_request'
        run: make test-run TESTS=test/smoke_editor.rb
