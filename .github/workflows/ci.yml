name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out carat
        uses: actions/checkout@v4

      - name: Resolve the Spinel commit
        id: spinel
        run: echo "rev=$(make -s spinel-rev)" >> "$GITHUB_OUTPUT"

      - name: Restore the toolchain from cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: spinel-${{ runner.os }}-${{ steps.spinel.outputs.rev }}

      - name: Build and install the toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make toolchain SPINEL_SRC="$RUNNER_TEMP/spinel" PREFIX="$HOME/.local"

      - name: Put the toolchain on the path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Doctor
        run: make doctor

      - name: Build
        run: make build

      - name: Generated config is current
        run: |
          make gen-config
          git diff --exit-code -- carat/domain/default_config.rb

      - name: Test
        run: make test
