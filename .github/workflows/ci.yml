name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out carat
        uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          make toolchain SPINEL_SRC="$RUNNER_TEMP/spinel" PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Doctor
        run: make doctor

      - name: Build
        run: make build

      - name: Generated config is current
        run: |
          make gen-config
          git diff --exit-code -- carat/domain/default_config.rb

      - name: Test
        run: make test
