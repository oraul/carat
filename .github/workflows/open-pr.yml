name: open-pr

# The delivery's pull requests are opened here, on GitHub's runners: a
# pull request created over GitHub's API from a delivery session gets a
# footer the session's network layer appends, while a git push arrives
# unchanged. The contributor pushes an annotated tag pr/BRANCH whose
# message is the title, a blank line, and the gated body
# (tools/pr_tag.sh push); this workflow gates them with main's tools,
# opens the pull request, reads it back, and deletes the tag.
on:
  push:
    tags: ['pr/**']

permissions:
  contents: read

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    # The secret PR_TOKEN is the environment AI's, which only a job naming
    # the environment can read: a token of the user's, so the pull
    # request's events start CI and the scan. GITHUB_TOKEN never creates
    # it, since its events start no workflow.
    environment: AI
    steps:
      # The workflow and tools/pr_tag.sh are the tagged commit's, so a
      # change that adds them opens its own pull request.
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      # The gates are main's, checked out to their own path, so a branch
      # cannot weaken the checks of its own title and body.
      - name: Check out main's gates
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false

      # Every value from the tag reaches the shell through files and the
      # environment, never written into a script.
      - name: Read the title and body from the tag
        working-directory: head
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch -q --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          sh tools/pr_tag.sh read "$TAG" "$RUNNER_TEMP/pr"

      - name: Refuse a branch of no allowed type or missing on origin
        working-directory: head
        env:
          TAG: ${{ github.ref_name }}
        run: sh tools/pr_tag.sh branch "${TAG#pr/}"

      - name: Gate the title and body with main's tools
        working-directory: head
        run: sh tools/pr_tag.sh gate "$RUNNER_TEMP/pr" ../main/tools

      - name: Open the pull request and read it back
        working-directory: head
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::the environment AI holds no secret PR_TOKEN"; exit 1; }
          pr=$RUNNER_TEMP/pr
          branch=${TAG#pr/}
          gh pr create --repo "$GH_REPO" --base main --head "$branch" --title "$(cat "$pr/title")" --body-file "$pr/body"
          gh pr view "$branch" --repo "$GH_REPO" --json title --jq .title > "$pr/title.live"
          gh pr view "$branch" --repo "$GH_REPO" --json body --jq .body > "$pr/body.live"
          sh tools/pr_tag.sh same "$pr"

  # Only after the pull request was opened and read back equal; a tag
  # still on origin tells tools/pr_tag.sh wait the workflow failed. This
  # job runs no repository code, so the one that does keeps contents: read.
  delete:
    needs: open
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
