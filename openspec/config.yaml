schema: spec-driven

context: |
  Carat is a terminal IDE in Ruby with Neovim's modal editing model.
  Spinel does everything: spin build, spin run, and spin test are the
  only toolchain, at the Ruby 4 language level, and CRuby is never
  required. Tests are Spinel programs using Carat::Testing with committed
  .expected snapshots; there is no minitest and no RuboCop.
  The architecture in docs/architecture.md is binding: Clean Architecture
  layers (domain, use_cases, ports, adapters, drivers) with dependencies
  pointing inward only, the module names, and the roadmap order.
  All code must compile with Spinel: standard library only, no gems,
  no json library (use Carat::Json), no IO.popen, no eval, method_missing,
  send with a computed name, define_method under a runtime condition,
  or custom hash/eql?; string literals are frozen; line arrays hold only
  strings; every ivar is initialized in initialize; no Ractor, threads
  only in drivers with a Queue between them and the editor thread.
  Every key binding lives in config/default.json; none is hard-coded.
  Every Neovim command Carat implements is recorded in
  docs/compatibility.md with a table-driven test.
  Layers live at carat/domain, carat/use_cases, carat/ports,
  carat/adapters, carat/drivers; bin/*.rb are compile roots.

rules:
  proposal:
    - Name which roadmap item from docs/architecture.md the change delivers, or say it is outside the roadmap and why
    - State what is out of scope
  specs:
    - Write requirements in terms of keys pressed and observable editor state, not implementation
  tasks:
    - Each task names the module it touches and the test that proves it
    - Keep the editor usable after every task

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
