schema: spec-driven

context: |
  Carat is a terminal IDE in Ruby with Neovim's modal editing model.
  Spinel does everything: spin build, spin run, and spin test are the
  only toolchain, at the Ruby 4 language level, and CRuby is never
  required. Tests are Spinel programs using Carat::Testing with committed
  .expected snapshots; there is no minitest and no RuboCop.
  The architecture in docs/architecture.md is binding: Clean Architecture
  layers (domain, use_cases, ports, adapters, drivers) with dependencies
  pointing inward only, the module names, and the roadmap order.
  All code must compile with Spinel: standard library only, no gems,
  no json library (use Carat::Json), no IO.popen, no eval, method_missing,
  send with a computed name, define_method under a runtime condition,
  or custom hash/eql?; string literals are frozen; line arrays hold only
  strings; every ivar is initialized in initialize; no Ractor, threads
  only in drivers with a Queue between them and the editor thread.
  Every key binding lives in config/default.caratrc (or a plugin
  manifest, as configuration lines); none is hard-coded.
  Everything beyond core modal editing is a plugin on the plugin API of
  docs/architecture.md section 9: compiled plugins are spin packages
  listed in config/plugins.caratrc with a generated registry, process
  plugins speak JSON-RPC per docs/plugin-protocol.md. A plugin may
  require only carat/plugin_api.rb.
  Every Neovim command Carat implements is recorded in
  docs/compatibility.md with a table-driven test.
  Layers live at carat/domain, carat/use_cases, carat/ports,
  carat/adapters, carat/drivers; bin/*.rb are compile roots.

rules:
  proposal:
    - Name which roadmap item from docs/architecture.md the change delivers, or say it is outside the roadmap and why
    - State what is out of scope
    - 'When the change has delta specs, name README.md and docs/architecture.md under Impact, each as changed or as "- README.md: unchanged, REASON"; a change to agents, workflows, commands, the Makefile, or the gates, run state, or guard script does the same for CLAUDE.md (make gates checks it)'
  specs:
    - Write requirements in terms of keys pressed and observable editor state, not implementation
    - Give each scenario a name the test that proves it can carry in its label or a comment; make gates refuses an ADDED or MODIFIED scenario no test names
  tasks:
    - Each task names the module it touches and the test that proves it
    - Keep the editor usable after every task

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# The quality review is the contributor's own step (review-in-openspec, the
# user's decision of 2026-11-21): no reviewer start of the delivery runs it.
operations:
  apply:
    guidance:
      - 'Once every task of tasks.md is done, review the whole committed diff (git diff origin/main...HEAD) with the instructions of .claude/agents/quality-reviewer.md: a bug or an untested behavior change, and its advisory points'
      - 'Append each finding as a new task under a "## Quality review" heading of tasks.md, naming its file:line and the test that proves the fix, and fix those tasks in the same session'
      - 'Append a finding you will not fix to docs/findings/<change>.md with its reason, as a "### title" entry with Location, Why, and Fix lines, and mark its task done as recorded there, with that reason'
      - 'Report the quality_review result field: status done, and the counts of tasks added, fixed, and recorded (fixed plus recorded equals added)'
      - 'The session runs in this order (contributor-self-check, the user''s decision of 2026-11-21): the tasks, the quality tasks and their fixes, a commit, make docs-lint and make gates, sh tools/run_state.sh merge-main <change> when the lane is behind origin/main, then sh tools/run_state.sh check <change> and its fixes as docs/contributor-notes.md, Checking, says, then return; the archive stays the package step''s first'
  archive:
    guidance:
      - 'Archive only after the quality review of the apply step: a "## Quality review" heading in tasks.md, or none when it found nothing, and every task marked done, fixed or recorded in docs/findings/<change>.md'
