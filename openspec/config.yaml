schema: spec-driven

context: |
  Carat is a terminal IDE in Ruby with Neovim's modal editing model,
  developed on CRuby 4 and released as a native binary built with Spinel.
  The architecture in docs/architecture.md is binding: Clean Architecture
  layers (domain, use_cases, ports, adapters, drivers) with dependencies
  pointing inward only, the module names, and the roadmap order.
  All production code must compile with Spinel: standard library only,
  no gems, no json library (use Carat::Json), no eval, method_missing,
  send with a computed name, define_method under a runtime condition,
  or custom hash/eql?; string literals are frozen; line arrays hold only
  strings; every ivar is initialized in initialize; no Ractor, threads
  only in drivers with a Queue between them and the editor thread.
  Every key binding lives in config/default.json; none is hard-coded.
  Every Neovim command Carat implements is recorded in
  docs/compatibility.md with a table-driven test.
  Tests use minitest from the standard library and run on CRuby 4.

rules:
  proposal:
    - Name which roadmap item from docs/architecture.md the change delivers, or say it is outside the roadmap and why
    - State what is out of scope
  specs:
    - Write requirements in terms of keys pressed and observable editor state, not implementation
  tasks:
    - Each task names the module it touches and the test that proves it
    - Keep the editor usable after every task

# Project context (optional)
